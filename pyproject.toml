[project]
name = "certified-dplus"
version = "0.1.0"
description = "1-D consistency test for magnetotelluric responses (D+) with an exactly verified lower bound on the misfit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "python-flint>=0.7",
    "scipy>=1.11",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mpmath>=1.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/certified_dplus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
